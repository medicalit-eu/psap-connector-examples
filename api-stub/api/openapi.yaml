      additionalProperties: true
      properties:
        id:
          description: Incident id.
          example: 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        createdTimeUtc:
          description: "Timestamp (in UTC) that determines the beginning of the incident.\r\
            \nThis represents the exact time that the incident was received by the\
            \ emergency message server (EMS)."
          format: date-time
          type: string
        appInfo:
          allOf:
          - $ref: "#/components/schemas/NG_SOS.Incidents.Domain.AppInfo"
          description: Information about caller's application that was used to create
            the incident.
        caller:
          allOf:
          - $ref: "#/components/schemas/NG_SOS.Incidents.Domain.Caller"
          description: Information about the caller.
        classification:
          allOf:
          - $ref: "#/components/schemas/NG_SOS.Incidents.Domain.Classification"
          description: "Incident classification. Caller can describe their or someone\
            \ else's condition using images/pictograms and corresponding textual descriptions.\r\
            \nThis information is intended to be used mainly by hearing-impaired people.\
            \ However, it is also commonly used by foreigners that do not speak the\
            \ local language."
          nullable: true
        deviceInfo:
          allOf:
          - $ref: "#/components/schemas/NG_SOS.Incidents.Domain.DeviceInfo"
          description: Information about caller's device.
        position:
          allOf:
          - $ref: "#/components/schemas/NG_SOS.Abstractions.Geography.Position"
          description: Caller's position.
          nullable: true
        psaps:
          description: "PSAPs notified about this incident. This information is calculated\
            \ based on caller's position and requested emergency services.\r\nWhenever\
            \ an incident is created with multiple PSAPs, it means that the caller\
            \ is:\r\n    1) Close to multiple areas that are operated by different\
            \ PSAPs or\r\n    2) Within a single area that is operated by different\
            \ PSAPs, which provide different emergency services or\r\n    3) Combination\
            \ of above"
          items:
            $ref: "#/components/schemas/NG_SOS.Psaps.Api.Abstractions.v2.Psap"
          type: array
        activatedEmergencyServices:
          description: Types of rescue services that were notified about this incident.
          example:
          - EmergencyMedicalService
          - MountainRescueService
          items:
            $ref: "#/components/schemas/NG_SOS.Abstractions.EmergencyServiceType"
          type: array
        isTest:
          description: Indication that incident is for test purposes only.
          type: boolean
        requestTimeStampUtc:
          format: date-time
          type: string
        requestId:
          format: uuid
          type: string
      type: object
    NG_SOS.Psaps.Api.Abstractions.v2.Psap:
